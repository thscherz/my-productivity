name: Deploy myProductivity

on:
  push:
    branches:
      - main

jobs:
  # ===========================================================================
  # Job 1: Docker Image bauen und testen (lokaler Test-Build)
  # ===========================================================================
  build:
    name: Docker Image bauen
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Docker Image bauen (Test-Build ohne Push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ghcr.io/thscherz/my-productivity:test

  # ===========================================================================
  # Job 2: Auf Netcup VPS deployen (git pull + build on VPS)
  # ===========================================================================
  deploy:
    name: Auf VPS deployen
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Per SSH auf Netcup VPS deployen
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            echo "=== myProductivity Deployment gestartet ==="
            echo "Zeitstempel: $(date '+%Y-%m-%d %H:%M:%S')"

            # In Projektverzeichnis wechseln
            cd ~/myproductivity

            # Neuesten Code holen
            echo "--- git pull ---"
            git pull origin main

            # Datenbank sichern vor neuem Deploy
            echo "--- DB Backup ---"
            if [ -f "data/myproductivity.db" ]; then
              cp data/myproductivity.db data/myproductivity.db.pre-deploy.$(date +\%Y\%m\%d-\%H\%M\%S)
              echo "Datenbank-Backup erstellt"
            else
              echo "Keine Datenbank gefunden, kein Backup nötig"
            fi

            # Container neu bauen und starten
            echo "--- docker compose up -d --build ---"
            docker compose up -d --build

            # Kurz warten, dann Health-Check
            echo "--- Health-Check ---"
            sleep 5
            curl -sf http://localhost:8001/api/v1/health || (echo "FEHLER: Health-Check fehlgeschlagen!" && exit 1)

            echo "=== Deployment erfolgreich abgeschlossen ==="
