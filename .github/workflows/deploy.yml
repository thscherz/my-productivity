name: Build & Deploy myProductivity

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Netcup VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/thscherz/my-productivity:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/my-productivity

            # Neuestes Image pullen
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/thscherz/my-productivity:latest

            # docker-compose.yml aktualisieren (aus dem Repo)
            cat > docker-compose.yml << 'EOF'
            services:
              my-productivity:
                image: ghcr.io/thscherz/my-productivity:latest
                container_name: my-productivity
                ports:
                  - "8001:8001"
                volumes:
                  - ./data:/app/backend/data
                env_file:
                  - .env
                restart: unless-stopped
                healthcheck:
                  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/v1/health')"]
                  interval: 30s
                  timeout: 10s
                  retries: 3
                  start_period: 15s
            EOF

            # Service neu starten
            docker compose up -d --remove-orphans

            # Altes Image aufraumen
            docker image prune -f

            echo "Deployment abgeschlossen: $(date)"
