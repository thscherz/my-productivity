services:
  my-productivity:
    build: .
    container_name: my-productivity
    ports:
      - "8001:8001"
    volumes:
      # SQLite-Datenbank persistent auf dem Host speichern
      - ./data:/app/backend/data
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
